name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@v1.22.0
        with:
          node-version: "26"
          cache: true
      - run: vp check
      - run: vp test
      - run: vp build
