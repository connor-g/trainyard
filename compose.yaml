name: rail-yard
services:
  web:
    build:
      context: .
      target: web
    depends_on:
      layouts:
        condition: service_healthy
    ports:
      - "127.0.0.1:8090:80"
      - "${RAIL_YARD_LAN_IP:-192.168.1.3}:8090:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 2s
  layouts:
    build:
      context: .
      target: layouts
    restart: unless-stopped
    environment:
      LAYOUT_DIRECTORY: /data
    volumes:
      - ./saved-yards:/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/layouts').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 2s
